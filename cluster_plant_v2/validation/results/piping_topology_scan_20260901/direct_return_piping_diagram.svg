<svg viewBox="0 0 680 410" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>异程式冷板管网布置与流量分配（精简版）</title>
<desc>供液母管左到右，回液母管右到左，冷板支路流量沿程衰减，极差 13.78%。</desc>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="34" font-family="var(--font-sans)" font-size="15" font-weight="500" fill="#2C2C2A" dominant-baseline="central">异程式冷板管网布置与流量分配（direct-return）</text>

<!-- 供液母管 左→右 -->
<line x1="88" y1="78" x2="650" y2="78" stroke="#378ADD" stroke-width="3" marker-end="url(#b)"/>
<!-- 回液母管 右→左 -->
<line x1="650" y1="250" x2="104" y2="250" stroke="#BA7517" stroke-width="3" marker-end="url(#a)"/>

