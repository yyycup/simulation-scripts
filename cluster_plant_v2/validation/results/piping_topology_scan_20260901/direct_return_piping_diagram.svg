<text x="570" y="276" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#854F0B" dominant-baseline="central">0.085</text>

<!-- 冷源机组 -->
<rect x="55" y="318" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="130" y="337" text-anchor="middle" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">冷源机组</text>
<text x="130" y="354" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A" dominant-baseline="central">水泵 + 蒸发器</text>
<line x1="88" y1="318" x2="88" y2="78" stroke="#378ADD" stroke-width="3"/>
<line x1="104" y1="250" x2="104" y2="318" stroke="#BA7517" stroke-width="3"/>

<text x="40" y="392" font-family="var(--font-sans)" font-size="12" fill="#5F5E5A" dominant-baseline="central">供液左→右、回液右→左；冷板 n 路径 2n 段不等阻，流量沿程衰减（极差 13.78%）</text>
