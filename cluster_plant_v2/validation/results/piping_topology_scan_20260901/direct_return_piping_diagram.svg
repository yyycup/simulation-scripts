<rect x="570" y="150" width="80" height="52" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="130" y="170" text-anchor="middle" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">冷板 1</text>
