<line x1="610" y1="202" x2="610" y2="250" stroke="#BA7517" stroke-width="1.5"/>

<!-- 母管段流量 -->
<text x="109" y="64" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#185FA5" dominant-baseline="central">0.446</text>
<text x="190" y="64" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#185FA5" dominant-baseline="central">0.349</text>
