<text x="490" y="170" text-anchor="middle" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">冷板 4</text>
<text x="610" y="170" text-anchor="middle" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">冷板 5</text>
<text x="130" y="189" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#5F5E5A" dominant-baseline="central">0.0974</text>
<text x="250" y="189" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#5F5E5A" dominant-baseline="central">0.0910</text>
